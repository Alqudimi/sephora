# SEPHORA UAE — Nginx production configuration
# Place in /etc/nginx/sites-available/sephora and symlink to sites-enabled.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sephora
#   sudo ln -s /etc/nginx/sites-available/sephora /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com   # issues the TLS certificates

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx ≥ 1.25 (drop this line on older releases)
    server_name your-domain.com www.your-domain.com;

    # ── TLS (issue with certbot: certbot --nginx -d your-domain.com) ──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /var/www/sephora/public;
    index index.php index.html;

    charset utf-8;

    # ── Max upload (product images; keep ≥ PHP upload_max_filesize) ──
    client_max_body_size 20M;

    # ── Compression (text assets; images are already WebP) ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # ── Security headers (CSP is set by the app itself) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Static asset caching (Vite builds are fingerprinted) ──
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Laravel front controller ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Health endpoint for load balancers / uptime monitors ──
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ── Deny hidden files (except ACME challenges) ──
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Never serve raw source / dotfiles inside public ──
    location ~* ^/(?!index\.php|robots\.txt|favicon\.ico|build/|images/|js/|css/|fonts/|storage/).+\.(php|json|md|ya?ml|env)$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
