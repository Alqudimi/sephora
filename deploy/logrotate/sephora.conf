# ─────────────────────────────────────────────────────────────────
# SEPHORA UAE — log rotation
# Install:  sudo cp deploy/logrotate/sephora.conf /etc/logrotate.d/sephora
#
# The app already uses LOG_CHANNEL=daily (14-day retention built in);
# this policy covers worker.log (supervisor/systemd output) and any
# single-channel fallback logs.
# ─────────────────────────────────────────────────────────────────

/var/www/sephora/storage/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0644 www-data www-data
    su www-data www-data
    sharedscripts
}
