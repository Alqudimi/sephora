; ─────────────────────────────────────────────────────────────────
; SEPHORA UAE — production OPcache tuning for PHP 8.3 FPM
;
; Install:
;   sudo cp deploy/php/opcache.ini /etc/php/8.3/fpm/conf.d/20-opcache.ini
;   sudo systemctl restart php8.3-fpm
;
; The launch audit (php artisan app:production-check) warns while OPcache
; is off: without it every request recompiles the whole framework.
; ─────────────────────────────────────────────────────────────────

opcache.enable=1

; CLI (artisan, queue workers) keeps its own lifecycle; no benefit.
opcache.enable_cli=0

; Framework + Filament + app ≈ 12–15k files; 192 MB is comfortable headroom.
opcache.memory_consumption=192

; Interned strings are shared across FPM workers — saves real memory.
opcache.interned_strings_buffer=24

; Must cover the largest file count the app will ever hold.
opcache.max_accelerated_files=20000

; PRODUCTION: never stat() files on every request (biggest win).
; Code changes (deploy.sh) restart the queue and reload FPM, which
; picks up new files — set to 1 only while debugging on the server.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Wasted-memory tolerance before an automatic restart.
opcache.max_wasted_percentage=10

; realpath cache (outside OPcache but usually forgotten in tuning guides)
realpath_cache_size=4096K
realpath_cache_ttl=600

; JIT (PHP 8+): tracing mode is safe for Laravel/Filament. Gains are
; modest for I/O-bound apps; uncomment to A/B it yourself.
; opcache.jit=tracing
; opcache.jit_buffer_size=64M
