; ─────────────────────────────────────────────────────────────────
; SEPHORA UAE — queue worker (supervisor)
; Install:  sudo cp deploy/supervisor/sephora-queue.conf /etc/supervisor/conf.d/
;           sudo supervisorctl reread && sudo supervisorctl update
; Logs:     /var/www/sephora/storage/logs/worker.log
; Restart after each deploy is handled by deploy/deploy.sh (queue:restart).
; ─────────────────────────────────────────────────────────────────

[program:sephora-queue]
command=php /var/www/sephora/artisan queue:work --queue=payments,emails,default,low --tries=3 --backoff=30 --timeout=60 --sleep=1 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/sephora/storage/logs/worker.log
stopasgroup=true
killasgroup=true
